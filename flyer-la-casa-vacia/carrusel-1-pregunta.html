<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>La casa vacía · carrusel 1</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --night:#1d1a20; --cream:#f2ebe3; --mist:#a59ca8; --rose:#e0a7a3; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden;background:var(--night)}
  .post{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--night);color:var(--cream)}
  svg.scene{position:absolute;inset:0}
  h1{position:absolute;top:150px;left:0;right:0;text-align:center;font-family:'Instrument Serif',serif;font-weight:400;font-size:100px;line-height:1}
  h1 em{color:var(--rose)}
  .sub{position:absolute;top:1112px;left:0;right:0;text-align:center;font-family:'Instrument Serif',serif;font-size:40px;color:var(--cream)}
  .swipe{position:absolute;bottom:56px;right:70px;font-family:'Jost',sans-serif;font-weight:500;font-size:17px;letter-spacing:.3em;text-transform:uppercase;color:var(--mist)}
  .grain{position:absolute;inset:0;opacity:.4;mix-blend-mode:overlay;pointer-events:none}
</style>
</head>
<body>
<div class="post">
  <svg class="scene" viewBox="0 0 1080 1350">
    <defs>
      <filter id="soft2"><feGaussianBlur stdDeviation="10"/></filter>
      <clipPath id="page"><rect x="330" y="440" width="420" height="550"/></clipPath>
    </defs>
    <g transform="translate(0 44) rotate(-2.2 540 990)">
      <ellipse cx="540" cy="998" rx="230" ry="14" fill="#000" opacity=".55" filter="url(#soft2)"/>
      <!-- a blank notebook page: the empty house before it's built -->
      <rect x="330" y="440" width="420" height="550" fill="#f2ebe3"/>
      <g clip-path="url(#page)" id="rules" stroke="#8fa3b8" stroke-opacity=".38" stroke-width="1.2"></g>
      <line x1="372" y1="440" x2="372" y2="990" stroke="#d98f8b" stroke-opacity=".6" stroke-width="1.4"/>
      <!-- faint creases: where it will fold into a house -->
      <path d="M330 650 L540 440 L750 650" fill="none" stroke="#b9ada3" stroke-width="1" stroke-dasharray="5 7" opacity=".7"/>
      <!-- a cursor waiting on the first line -->
      <rect x="386" y="488" width="3" height="30" fill="#3a3140"/>
    </g>
  </svg>

  <h1>¿Quieres volver<br>a escribir <em>como antes?</em></h1>
  <p class="sub">sin miedo a la página en blanco</p>
  <div class="swipe">desliza →</div>

  <svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .6  0 0 0 0 .55  0 0 0 0 .6  0 0 0 .45 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
<script>
  const NS = "http://www.w3.org/2000/svg", R = document.getElementById("rules");
  for (let y = 522; y < 990; y += 34) {
    const l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 330); l.setAttribute("x2", 750); l.setAttribute("y1", y); l.setAttribute("y2", y);
    R.appendChild(l);
  }
</script>
</body>
</html>
